# GNOME settings, applied by steps/gnome.sh with `dconf load / < config/gnome.ini`.
# Only the keys listed here are written; everything else is left alone.
# dconf doesn't check keys against schemas, so a typo is accepted silently.
# Find a key's path and current value with `dconf dump /` or `dconf watch /` while changing it in Settings.
# Unsigned integers need their type: idle-delay=uint32 480.

# ---------- Lock screen and power ----------
[org/gnome/desktop/session]
idle-delay=uint32 480

[org/gnome/desktop/screensaver]
lock-delay=uint32 120

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'

# ---------- Desktop ----------
[org/gnome/desktop/interface]
enable-hot-corners=false
cursor-size=32

[org/gnome/desktop/search-providers]
disable-external=true

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'lt')]

[org/gnome/nautilus/icon-view]
default-zoom-level='small-plus'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true
sort-directories-first=true

[org/gnome/shell]
favorite-apps=['chrome-ompifgpmddkgmclendfeacglnodjjndh-Default.desktop', 'com.mitchellh.ghostty.desktop', 't3code.desktop', 'org.gnome.TextEditor.desktop', 'com.microsoft.VSCode.desktop', 'google-chrome.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Calculator.desktop']
enabled-extensions=['background-logo@fedorahosted.org', 'dash-to-dock@micxgx.gmail.com', 'launcher@adaspt', 'appindicatorsupport@rgcjonas.gmail.com', 'mail-monitor@adaspt', 'window-keys@adaspt']

# ---------- Keyboard shortcuts ----------
[org/gnome/settings-daemon/plugins/media-keys]
home=['<Super>e']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name='Screenshot with Gradia interactive'
command='flatpak run be.alexandervanhee.gradia --screenshot=INTERACTIVE'
binding='<Shift><Super>s'

[org/gnome/desktop/wm/keybindings]
close=['<Super>w']

# ---------- Dash to Dock: bottom, auto-hide, not full width, fixed transparency ----------
[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
dock-fixed=false
extend-height=false
transparency-mode='FIXED'
disable-overview-on-startup=true
